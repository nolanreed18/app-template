<title>__APP_NAME__</title>
<style>
/* Dark-only, phone first. Colours are tokens here; the canvas reads them through getComputedStyle so the two never drift. */
:root{--bg:#0b0e14;--panel:#141a24;--line:#263041;--fg:#e9eef5;--muted:#8d9ab0;--accent:#ffb340;--dot:#55c8ff;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
/* The bar takes the notch and Dynamic Island itself. padding-top comes last and nothing after it may set padding or padding-block
   (Lodebreaker's HUD sat under the status bar on iPhone when a phone media query set padding-block). */
.bar{display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:max(10px,env(safe-area-inset-top,0px))}
.name{font-weight:700;letter-spacing:.08em;color:var(--accent)}
#count{margin-left:auto;font-variant-numeric:tabular-nums}
#cv{flex:1;min-height:0;width:100%;display:block;touch-action:none}
/* The build id: how a phone, the web and a screenshot say which commit they run. Keep it visible somewhere in every app. */
#ver{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:11px;pointer-events:none}
</style>
<div id="app">
 <header class="bar"><span class="name">__APP_NAME__</span><span id="count">Taps: 0</span></header>
 <canvas id="cv" aria-label="Tap anywhere to move the dot"></canvas>
</div>
<div id="ver"></div>
